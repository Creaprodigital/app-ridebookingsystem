# Builds an installable Android APK directly on GitHub's runners
# (no Expo account needed). The APK is attached to the run as an artifact.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'frontend/**'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Same public env (backend URL, Maps key) as the EAS "preview" profile,
      # so eas.json stays the single source of truth.
      - name: Load app env from eas.json
        run: jq -r '.build.base.env | to_entries[] | "\(.key)=\(.value)"' eas.json >> "$GITHUB_ENV"

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: frontend/android
        run: |
          sed -i 's/-Xmx2048m/-Xmx4096m/' gradle.properties
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Rename APK
        id: apk
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          NAME="ridebookingsystem-${VERSION}-${GITHUB_SHA::7}.apk"
          mv android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: frontend/${{ steps.apk.outputs.name }}
          retention-days: 30
